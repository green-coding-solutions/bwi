# Spring PetClinic REST with Postgres and the React frontend, for trying things out.
# Start it with docker compose -f petclinic/compose.yml up -d --build
name: petclinic

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    healthcheck:
      test: pg_isready -U petclinic
      interval: 2s

  backend:
    image: springcommunity/spring-petclinic-rest:4.0.2
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      POSTGRES_URL: jdbc:postgresql://db/petclinic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl -fs http://localhost:9966/petclinic/actuator/health
      interval: 2s
      start_period: 120s
      start_interval: 1s
    ports:
      - 127.0.0.1:9966:9966

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:8090:80
