server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PetClinic has no status endpoint. Until a later lab adds a real SSE
    # endpoint, /api/status simply returns the list of all visits.
    location = /api/status {
        proxy_pass http://app:9966/petclinic/api/visits;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://app:9966/petclinic/api/;
        proxy_buffering off;
    }

    # Single page app: unknown paths are handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
