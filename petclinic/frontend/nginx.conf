server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PetClinic has no status endpoint, so /api/status simply returns the list of
    # all visits. The branch lab/b1-sse replaces the polling with a real SSE endpoint.
    location = /api/status {
        proxy_pass http://backend:9966/petclinic/api/visits;
        proxy_buffering off;
    }

    # Server-Sent Events. With buffering on, nginx would hold the events back.
    location = /api/status/stream {
        proxy_pass http://backend:9966/petclinic/api/status/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:9966/petclinic/api/;
        proxy_buffering off;
    }

    # Single page app: unknown paths are handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
